<!doctype html>
<html lang="en"><meta charset="utf-8"><title>ParaJaca media integration tests</title>
<body><pre id="results">Running browser integration tests…</pre>
<script type="module">
import { createPlayer } from '../src/core/player.js';
import { createRenderer, createFrameState } from '../src/core/render/renderer.js';
import { inspectVector, createAnimatedSource } from '../src/core/sources/media-source.js';
import { rasterizeSvg } from '../src/core/sources/svg-source.js';
import { zipSync, strToU8 } from 'fflate';

const result = { browser: navigator.userAgent, dpr: devicePixelRatio, tests: [] };
const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const signal = () => new AbortController().signal;
function assert(value, message) { if (!value) throw new Error(message); }
async function test(name, run) {
  try { await run(); result.tests.push({ name, pass: true }); }
  catch (error) { result.tests.push({ name, pass: false, error: String(error.message || error)+'\n'+String(error.stack || '') }); }
}
async function waitFor(condition, message) {
  for (let i = 0; i < 200 && !condition(); i++) await delay(25);
  assert(condition(), message);
}
const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100"><circle cx="30" cy="25" r="15" fill="red" opacity=".5"><animate attributeName="cx" values="30;170;30" dur="1s" repeatCount="indefinite"/></circle></svg>';
const animation = { v: '5.13.0', w: 200, h: 100, fr: 30, ip: 0, op: 30, assets: [], layers: [
  { ddd: 0, ind: 1, ty: 4, nm: 'Rectangle', sr: 1, ip: 0, op: 30, st: 0, bm: 0,
    ks: { o: { a: 0, k: 50 }, r: { a: 0, k: 0 },
      p: { a: 1, k: [{ t: 0, s: [30,25,0], e: [170,25,0], i: { x: .667, y: 1 }, o: { x: .333, y: 0 } }, { t: 30, s: [170,25,0] }] },
      a: { a: 0, k: [0,0,0] }, s: { a: 0, k: [100,100,100] } },
    shapes: [{ ty: 'gr', it: [
      { ty: 'rc', d: 1, s: { a: 0, k: [30,30] }, p: { a: 0, k: [0,0] }, r: { a: 0, k: 0 } },
      { ty: 'fl', c: { a: 0, k: [1,0,0,1] }, o: { a: 0, k: 100 }, r: 1 },
      { ty: 'tr', p: { a: 0, k: [0,0] }, a: { a: 0, k: [0,0] }, s: { a: 0, k: [100,100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 }, sk: { a: 0, k: 0 }, sa: { a: 0, k: 0 } },
    ] }],
  },
] };
const asSvg = (text) => new Blob([text], { type: 'image/svg+xml' });
const asJson = (data) => new Blob([JSON.stringify(data)], { type: 'application/json' });
function canvasPixels(canvas) { return canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data; }
function hash(pixels) { let sum = 0; for (let i = 0; i < pixels.length; i += 4) sum += (i+1)*(pixels[i]+pixels[i+3]); return sum; }

await test('SVG dimensions, transparency, and safe rejection', async () => {
  const info = await inspectVector(asSvg(svg.replace(/<animate[^>]*\/>/, '')), 'svg', signal());
  assert(info.width === 200 && info.height === 100 && !info.animated, 'native geometry');
  const bitmap = await rasterizeSvg(info.text, 200, 100, signal());
  const canvas = document.createElement('canvas'); canvas.width=200; canvas.height=100;
  canvas.getContext('2d').drawImage(bitmap,0,0); bitmap.close();
  const pixels = canvasPixels(canvas);
  assert(pixels[3] === 0 && pixels[(25*200+30)*4+3] >= 126, 'transparent and semi-transparent pixels');
  const viewBox = await inspectVector(asSvg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 400"><rect width="10" height="10"/></svg>'), 'svg', signal());
  assert(viewBox.width === 3000 && viewBox.height === 400, 'viewBox native dimensions');
  let rejected = false;
  try { await inspectVector(asSvg('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><script>alert(1)<\/script></svg>'), 'svg', signal()); }
  catch { rejected = true; }
  assert(rejected, 'script rejection');
  const invalidImage = await inspectVector(asSvg(svg.replace('<circle', '<image href="data:image/png;base64,bm90LWFuLWltYWdl" width="5" height="5"/><circle')), 'svg', signal());
  rejected = false;
  try { await createAnimatedSource(invalidImage, 200, 100, signal()); }
  catch (error) { rejected = /could not be decoded/.test(error.message); }
  assert(rejected, 'invalid embedded images are reported');
});

for (const type of ['svg', 'lottie', 'dotlottie']) {
  await test(`${type}: animated canvas, GPU alpha, orientation, blur and resource reuse`, async () => {
    let blob = type === 'svg' ? asSvg(svg) : asJson(animation);
    if (type === 'dotlottie') blob = new Blob([zipSync({ 'manifest.json': strToU8(JSON.stringify({ version: '2', animations: [{id:'test'}] })), 'a/test.json': strToU8(JSON.stringify(animation)) })]);
    const info = await inspectVector(blob, type, signal());
    const source = await createAnimatedSource(info, 200, 100, signal());
    const canvas = document.createElement('canvas'); canvas.width = 200; canvas.height = 100;
    document.body.appendChild(canvas);
    const renderer = createRenderer(canvas);
    const gl = canvas.getContext('webgl2');
    try {
      const initialHash = hash(canvasPixels(source.canvas));
      assert(initialHash > 0 && canvasPixels(source.canvas)[3] === 0, 'visible source with transparent corner');
      const req = { texScale: 1, contentSizeTex: {width:200,height:100}, textureSize: {width:200,height:100},
        paddingTex: {left:0,top:0,right:0,bottom:0}, levels: 5, maxLod: 4, sigmaMaxRef: 4 };
      renderer.setViewport(200,100,1,1);
      await renderer.prepareLayer('test', { bitmap: await createImageBitmap(source.canvas, {premultiplyAlpha:'premultiply'}),
        canvas: source.canvas, contentRectComp: {x:0,y:0,width:200,height:100}, opaque:false }, req, signal());
      const texture = renderer.getLayerResource('test').texture;
      let allocations = 0;
      const createTexture = gl.createTexture.bind(gl), createFramebuffer = gl.createFramebuffer.bind(gl);
      gl.createTexture = (...args) => { allocations++; return createTexture(...args); };
      gl.createFramebuffer = (...args) => { allocations++; return createFramebuffer(...args); };
      const state = createFrameState(); state.layerCount=1; state.layerIds[0]='test';
      state.rects.set([0,0,200,100]); state.opacities[0]=1;
      function pixels() { const data=new Uint8Array(200*100*4); gl.readPixels(0,0,200,100,gl.RGBA,gl.UNSIGNED_BYTE,data); return data; }
      renderer.draw(state); const first = pixels();
      assert(first[(75*200+30)*4+3] >= 125, 'initial vertical orientation');
      assert(source.update(250), 'animation advances');
      assert(hash(canvasPixels(source.canvas)) !== initialHash, 'different source frames');
      renderer.updateLayer('test'); renderer.draw(state); const changed = pixels();
      assert(hash(first) !== hash(changed), 'different composited frames');
      assert(changed[(75*200+30)*4+3] === 0, 'old frame cleared without trails');
      let semi = 0;
      for (let i=0;i<changed.length;i+=4) if (changed[i+3]>120 && changed[i+3]<135) { semi++; assert(Math.abs(changed[i]-changed[i+3]) <= 2, 'alpha premultiplied exactly once'); }
      assert(semi>0 && changed[3]===0, 'transparent GPU output');
      assert(changed[(25*200+30)*4+3] === 0, 'updated vertical orientation');
      source.update(500); renderer.updateLayer('test'); state.lods[0]=2; renderer.draw(state);
      assert(hash(pixels())>0, 'blurred animation visible: source hash='+hash(canvasPixels(source.canvas))+' gl error='+gl.getError());
      assert(allocations===0 && renderer.getLayerResource('test').texture===texture, 'no per-frame GPU allocation');
      assert(gl.getError()===gl.NO_ERROR, 'no WebGL errors');
      if (type !== 'svg') { source.update(1000); assert(hash(canvasPixels(source.canvas))===initialHash, 'Lottie loops at source fps'); }
    } finally { renderer.dispose(); source.dispose(); canvas.remove(); }
  });
}

await test('official Lottie fixtures: independent paths, shapes, timing and cleanup', async () => {
  for (const name of ['adrock', 'bodymovin', 'bm_ronda']) {
    const blob = await (await fetch(`/node_modules/lottie-web/test/animations/${name}.json`)).blob();
    const info = await inspectVector(blob, 'lottie', signal());
    const source = await createAnimatedSource(info, 512, Math.max(1,Math.round(512*info.height/info.width)), signal());
    try {
      const first = hash(canvasPixels(source.canvas));
      source.update(500);
      const next = hash(canvasPixels(source.canvas));
      assert(first!==next, `${name} advances`);
    } finally { source.dispose(); }
  }
});

await test('official expression-based fixture is rejected with export guidance', async () => {
  const blob = await (await fetch('/node_modules/lottie-web/test/animations/ripple.json')).blob();
  let rejected = false;
  try { await inspectVector(blob, 'lottie', signal()); }
  catch (error) { rejected = /expressions.*keyframes/.test(error.message); }
  assert(rejected, 'executable expressions are reported explicitly');
});

await test('real player: animation survives convergence, pauses, resumes and reloads', async () => {
  const scene = await (await fetch('/demo/scene.json')).json();
  const layer = scene.variants[0].layers.at(-1);
  const asset = scene.assets.find((item) => item.id === layer.assetId);
  Object.assign(asset, { type: 'lottie', width:200,height:100,path:'assets/test.json' });
  Object.assign(layer.placement, { x:0,y:0,width:200,height:100 });
  const host = document.createElement('div'); host.style.cssText='position:relative;width:960px;height:540px';
  document.body.appendChild(host);
  let draws=0; const errors=[];
  const player = createPlayer(host, { quality:'low', diagnostics:()=>draws++, assetResolver:(item)=>item.id===asset.id ? asJson(animation) : new URL(item.path,location.origin+'/demo/').href });
  player.on('error', (error)=>errors.push(error));
  try {
    await player.load(scene); assert(errors.length===0,JSON.stringify(errors));
    player.setAnimationPaused(false); await delay(350); const first=draws;
    await waitFor(()=>draws>first+2,'loop continues after convergence');
    player.setAnimationPaused(true); await delay(150); const paused=draws;
    await delay(200); assert(draws===paused,'pause stops scheduling');
    player.setAnimationPaused(false); await waitFor(()=>draws>paused+2,'resume works');
    await player.edit({type:'set-layer',layerId:layer.id,changesLayer:{placement:{x:57,y:23,width:200,height:100},parallaxPercent:33}});
    const stored=player.getScene().variants[0].layers.find((item)=>item.id===layer.id);
    assert(stored.placement.width===200 && stored.placement.x===57 && stored.parallaxPercent===33,'native geometry and controls');
    await player.load(scene); assert(errors.length===0,'reload has no errors');
  } finally { player.dispose(); host.remove(); }
});

await test('demo: SVG code and Lottie import controls apply working layers', async () => {
  const frame=document.createElement('iframe'); frame.src='/demo/'; frame.width='1200'; frame.height='800'; document.body.appendChild(frame);
  try {
    await new Promise((resolve)=>frame.addEventListener('load',resolve,{once:true}));
    const doc=frame.contentDocument;
    await waitFor(()=>!doc.getElementById('config-save').disabled,'demo ready');
    doc.getElementById('replace-open').click();
    doc.querySelector('.slot-row .layers-toolbar button:last-child').click();
    doc.getElementById('svg-code').value=svg.replace(/<animate[^>]*\/>/,'');
    doc.getElementById('svg-code-apply').click();
    await waitFor(()=>!doc.getElementById('svg-code-dialog').open,'SVG code accepted');
    assert(!doc.getElementById('replace-apply').disabled,'SVG replacement enabled');
    doc.getElementById('replace-apply').click();
    await waitFor(()=>!doc.getElementById('replace-dialog').open,'SVG applied');
    doc.getElementById('replace-open').click();
    const transfer=new DataTransfer(); transfer.items.add(new File([JSON.stringify(animation)],'animation_7.json',{type:'application/json'}));
    doc.getElementById('replace-files').files=transfer.files;
    doc.getElementById('replace-files').dispatchEvent(new Event('change'));
    try { await waitFor(()=>!doc.getElementById('replace-apply').disabled,'Lottie replacement enabled'); }
    catch (error) { throw new Error(String(error)+'; status='+doc.getElementById('replace-status').textContent+'; rows='+doc.querySelectorAll('.slot-row').length); }
    doc.getElementById('replace-apply').click();
    try { await waitFor(()=>!doc.getElementById('replace-dialog').open,'Lottie applied'); }
    catch (error) { throw new Error(String(error)+'; status='+doc.getElementById('replace-status').textContent+'; error='+doc.getElementById('error-box').textContent); }
    assert(!doc.getElementById('animation-toggle').disabled,'animation controls enabled');
    doc.getElementById('animation-toggle').click();
    assert(doc.getElementById('animation-toggle').textContent.includes('Reproduzir'),'pause updates UI');
    assert(doc.getElementById('error-box').style.display!=='block','no demo error');
  } finally { frame.remove(); }
});

result.pass=result.tests.every((item)=>item.pass);
document.getElementById('results').textContent=JSON.stringify(result,null,2);
document.title=result.pass?'MEDIA TESTS PASS':'MEDIA TESTS FAIL';
navigator.sendBeacon('/__media-test-result',JSON.stringify(result));
</script></body></html>
